server:
  log_level: info

metrics:
  wal_directory: /tmp/agent/wal

  global:
    scrape_interval: 5s

  configs:
    - name: k6

      scrape_configs:
        - job_name: "k6"
          static_configs:
            - targets: ["host.docker.internal:6565"]

      remote_write:
        - url: http://victoria-metrics:8428/api/v1/write
