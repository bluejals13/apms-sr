spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 1234
    
  jpa:
    hibernate:
      # 빈 테이블 자동 생성 기능(create-drop)을 끄고 검증(validate)만 수행
      ddl-auto: validate 
    show-sql: true

  flyway:
    # 빈 테이블 대신 Flyway 스크립트가 실행되어 기초 데이터(Role, Permission)를 적재하도록 복구
    enabled: true 

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false