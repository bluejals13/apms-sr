# src/main/resources/application.yml

server:
  port: 8080

spring:
  # 1. Database (MySQL)
  datasource:
    url: jdbc:mysql://mysql:3306/eventdb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password # 운영 환경 배포 시 ${MYSQL_PASSWORD}로 대체 권장

  # 2. Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      repositories:
        enabled: false

  # 3. JPA (로그 폭포 차단)
  jpa:
    show-sql: false # 콘솔 출력 완벽 차단
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: validate

  # 4. Flyway (기존에 들여쓰기가 잘못되어 작동하지 않던 문제 수정)
  flyway:
    enabled: true
    baseline-on-migrate: false

# 5. Logging (프레임워크 노이즈 차단)
logging:
  level:
    root: INFO
    com.example.demo: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: WARN
    io.lettuce.core: WARN
    org.apache.catalina.core: WARN

# 6. JWT Configuration
jwt:
  secret: this_is_a_very_long_secret_key_for_jwt_signing_123456
  expiration: 3600000
  access-expiration: 3600000
  refresh-expiration: 604800000

# 7. Actuator (Prometheus 모니터링)
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always # slow-details 오타 교정